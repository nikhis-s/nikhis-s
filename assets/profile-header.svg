<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="headerTitle headerDesc">
  <title id="headerTitle">nikhis-s — Operations to AI/ML Engineering</title>
  <desc id="headerDesc">A deep navy banner with circuit-line motifs and the text "Building reliable software systems".</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#161e33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

  <!-- circuit lines, left -->
  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M40 80 H180 L210 110 H300"/>
    <path d="M40 150 H120 L150 120 H260 L290 150 H340"/>
    <path d="M40 220 H200 L230 190 H320"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="300" cy="110" r="3"/>
    <circle cx="340" cy="150" r="3"/>
    <circle cx="320" cy="190" r="3"/>
  </g>

  <!-- circuit lines, right -->
  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M1160 80 H1020 L990 110 H900"/>
    <path d="M1160 150 H1080 L1050 120 H940 L910 150 H860"/>
    <path d="M1160 220 H1000 L970 190 H880"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="900" cy="110" r="3"/>
    <circle cx="860" cy="150" r="3"/>
    <circle cx="880" cy="190" r="3"/>
  </g>

  <!-- central node motif -->
  <g opacity="0.9">
    <circle cx="600" cy="92" r="26" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="600" cy="92" r="6" fill="url(#accent)"/>
    <path d="M600 66 V40 M600 118 V140 M574 92 H548 M626 92 H652" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="600" cy="40" r="2.5" fill="#22d3ee"/>
    <circle cx="600" cy="140" r="2.5" fill="#3b82f6"/>
    <circle cx="548" cy="92" r="2.5" fill="#22d3ee"/>
    <circle cx="652" cy="92" r="2.5" fill="#3b82f6"/>
  </g>

  <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#e2e8f0" letter-spacing="1">Building reliable software systems</text>
  <text x="600" y="226" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="3">OPERATIONS  ·  PYTHON  ·  APPLIED AI / ML</text>

  <rect x="420" y="252" width="360" height="2" fill="url(#fade)"/>
</svg>
