<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">nikhis-s — building reliable software systems</title>
  <desc id="heroDesc">A deep navy banner with fine circuit and schematic motifs. A hexagonal monogram sits above the name nikhis-s, followed by the headline "Building reliable software systems" and a secondary line reading Python, applied AI/ML, operations engineering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="50%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#16233c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>

  <!-- schematic traces, left -->
  <g stroke="#1b2c4a" stroke-width="1.5" fill="none">
    <path d="M50 56 H190 L220 86 H300"/>
    <path d="M50 150 H120 L150 120 H250"/>
    <path d="M50 244 H180 L210 214 H300"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="300" cy="86" r="3"/>
    <circle cx="250" cy="120" r="3"/>
    <circle cx="300" cy="214" r="3"/>
  </g>

  <!-- schematic traces, right -->
  <g stroke="#1b2c4a" stroke-width="1.5" fill="none">
    <path d="M1150 56 H1010 L980 86 H900"/>
    <path d="M1150 150 H1080 L1050 120 H950"/>
    <path d="M1150 244 H1020 L990 214 H900"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="900" cy="86" r="3"/>
    <circle cx="950" cy="120" r="3"/>
    <circle cx="900" cy="214" r="3"/>
  </g>

  <!-- identity mark -->
  <circle cx="600" cy="64" r="46" fill="none" stroke="#16233c" stroke-width="1"/>
  <circle cx="600" cy="64" r="34" fill="#0b1220" stroke="url(#accent)" stroke-width="1.5"/>
  <path d="M600 38 L622.5 51 L622.5 77 L600 90 L577.5 77 L577.5 51 Z" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="600" y="75" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" font-weight="700" fill="#22d3ee">n</text>

  <!-- wordmark -->
  <text x="600" y="152" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f1f5f9" letter-spacing="2">nikhis-s</text>

  <!-- headline -->
  <text x="600" y="196" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">Building reliable software systems</text>

  <!-- secondary line -->
  <text x="600" y="227" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#7f97b4" letter-spacing="3">PYTHON  ·  APPLIED AI / ML  ·  OPERATIONS</text>

  <rect x="470" y="252" width="260" height="2" fill="url(#fade)"/>
</svg>
